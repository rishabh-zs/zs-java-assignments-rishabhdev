version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: assignment7-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: User#2026
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: