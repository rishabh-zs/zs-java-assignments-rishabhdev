plugins {
    id 'java'
    id 'application'
}

group = 'com.zs.assignment3'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.zs.assignment3.Main'
}

tasks.named('run') {
    standardInput = System.in
}
