plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group = 'com.zs.assignment10'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.2'
}

repositories {
    mavenCentral()
}

dependencies {
    // PostgresSQL JDBC driver for Assignment 10
    implementation 'org.postgresql:postgresql:42.7.7'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.16'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    // Needed by IntelliJ sometimes for running tests
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.11.0'

    // Mockito + JUnit5 support
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
    filter {
        failOnNoMatchingTests = false
    }
    // Keep test output clean on newer JDKs when Mockito/ByteBuddy instrumentation is used.
    jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
}

application {
    mainClass = 'com.zs.assignment10.Main'
}

tasks.register('runAssignment7', JavaExec) {
    group = 'execution'
    description = 'Run Assignment 7 - Database workflow'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zs.assignment7.Main'
    standardInput = System.in
}
